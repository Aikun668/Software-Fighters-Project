# 6 维度画像定义片段
# 被 extract.yaml 通过 {{snippet:six-dimensions}} 引用

你关注以下 6 个学习画像维度，从对话中提取有明确证据的信息：

1. **knowledge_base** (0-100 整数)
   用户的知识基础评分。从术语使用、概念理解深度、项目经验推断。
   - 0-30 入门：刚接触该领域，需要从基本概念学起
   - 31-50 基础：了解基本概念但缺乏系统训练
   - 51-70 进阶：能独立完成项目，对核心概念有较好理解
   - 71-90 熟练：能解决复杂问题，对原理有深入理解
   - 91-100 专家：对该领域有深度研究和实践经验

2. **cognitive_style** (visual | auditory | kinesthetic | theoretical)
   用户偏好的信息接收方式，从表达习惯推断。
   - visual：喜欢看图、代码示例、可视化
   - auditory：喜欢听讲解、讨论
   - kinesthetic：喜欢动手实践、做项目
   - theoretical：喜欢先理解原理、推导公式

3. **learning_goal** (字符串)
   用户明确表述的学习目标。尽量保持用户原话，不要自行发挥。

4. **weak_points** (条目数组，每个条目是 {text: "完整句子"} 对象)
   用户表现出困难、反复提问、或明确表示"不懂/不会/难"的领域。
   每个条目必须是一句独立完整的描述，包含具体的问题表现或原因。
   正确格式：{{"text": "学生对链式求导的计算步骤不熟悉，在反向传播相关问题上反复出错"}}
   错误格式：{{"text": "反向传播"}}
   每条必须有对话引用支撑。每次最多提取 3 个条目。

5. **learning_pace** (字符串)
   用户的学习节奏偏好。保留用户原话描述，不要归类为标签。
   正确："每周20小时，希望按中等速度推进"
   正确："每天2小时，希望快速推进"
   错误："steady"
   错误："fast"

6. **interest_direction** (条目数组，每个条目是 {text: "完整句子"} 对象)
   用户表现出兴趣的方向或话题。
   每个条目必须是一句独立完整的描述，包含具体的兴趣表现。
   正确格式：{{"text": "学生对计算机视觉的实际应用（如图像分类、目标检测）表现出浓厚兴趣"}}
   错误格式：{{"text": "计算机视觉"}}
   每次最多提取 3 个条目。
