# 6 维度画像定义片段
# 被 extract.yaml 通过 {{snippet:six-dimensions}} 引用

你关注以下 6 个学习画像维度，从对话中提取有明确证据的信息：

1. **knowledge_base** (0-100 整数)
   用户在 AI 领域的综合知识基础评分。从以下来源推断（按优先级排列）：
   - AI 直接经验：术语使用、概念理解深度、项目经验
   - 数学基础：高考/竞赛/大学数学成绩——数学是 AI 学习的核心前置能力，高分数学成绩可作为 15-35 区间的有效证据
   - 编程基础：语言熟练度、项目经验——编程能力同样是 AI 学习的重要前置条件
   综合评分区间（详见评分标准）：
   - 0-15 纯新手：零基础，无数学/编程优势
   - 16-30 入门：有数学或编程基础，但未接触 AI
   - 31-50 基础：了解 AI 基本概念，或数学/编程背景较强
   - 51-70 进阶：能独立完成项目，对核心概念有较好理解
   - 71-90 熟练：能解决复杂问题，对原理有深入理解
   - 91-100 专家：对该领域有深度研究和实践经验

2. **cognitive_style** (visual | auditory | kinesthetic | theoretical)
   用户偏好的信息接收方式，从表达习惯推断。
   - visual：喜欢看图、代码示例、可视化、视频教程（"看视频""看教程""看图"→visual）
   - auditory：喜欢听讲解、讨论、音频（"听播客""听讲座""听书"→auditory）
   - kinesthetic：喜欢动手实践、做项目
   - theoretical：喜欢先理解原理、推导公式

   **区分 visual vs auditory 的关键**：用户说"看视频""看教程视频""看网课"→visual（侧重视觉接收）；用户说"听音频""听播客""听讲座"→auditory（侧重听觉接收）。视频教程虽然也有声音，但用户主动提到"看"字时属于 visual。

3. **learning_goal** (字符串)
   用户明确表述的学习目标。尽量保持用户原话，不要自行发挥。

4. **weak_points** (条目数组，每个条目是 {text: "完整句子"} 对象)
   用户表现出困难、反复提问、或明确表示"不懂/不会/难"的领域。
   每个条目必须是一句独立完整的描述，包含具体的问题表现或原因。
   正确格式：{{"text": "学生对链式求导的计算步骤不熟悉，在反向传播相关问题上反复出错"}}
   错误格式：{{"text": "反向传播"}}
   每条必须有对话引用支撑。每次最多提取 3 个条目。

5. **learning_pace** (字符串)
   用户的学习节奏偏好。保留用户原话描述，不要归类为标签。
   正确："每周20小时，希望按中等速度推进"
   正确："每天2小时，希望快速推进"
   错误："steady"
   错误："fast"

6. **interest_direction** (条目数组，每个条目是 {text: "完整句子"} 对象)
   用户表现出兴趣的方向或话题。
   每个条目必须是一句独立完整的描述，包含具体的兴趣表现。
   正确格式：{{"text": "学生对计算机视觉的实际应用（如图像分类、目标检测）表现出浓厚兴趣"}}
   错误格式：{{"text": "计算机视觉"}}
   每次最多提取 3 个条目。
