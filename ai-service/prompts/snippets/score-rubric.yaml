# knowledge_base 评分标准片段
# 被 extract.yaml 通过 {{snippet:score-rubric}} 引用

评分时严格遵循以下标准，不确定时倾向保守估计：

| 分数区间 | 等级 | AI 领域直接证据 | 数学基础（前置证据） | 编程基础（前置证据） |
|---------|------|----------------|---------------------|---------------------|
| 0-15 | 纯新手 | "AI是什么"、"完全没学过" | 数学基础薄弱、惧怕数学 | 零编程基础、非理工科背景 |
| 16-30 | 入门 | "听说过深度学习但不清楚" | 高考数学高分(130+)、大学高数通过 | 了解基本编程概念（未实操） |
| 31-45 | 初级 | "学过Python基础，了解变量循环" | 数学竞赛获奖、数学专业背景 | 熟练掌握一门语言（如Python） |
| 46-55 | 中级 | "做过简单项目，会用sklearn" | 此阶段不再单纯参考数学成绩 | 独立完成过非AI类的中型项目 |
| 56-70 | 进阶 | "用PyTorch训练过模型，理解反向传播" | 熟悉数据结构与算法设计 | 熟悉数据结构与算法设计 |
| 71-85 | 熟练 | "能调参优化，理解各种损失函数" | — | — |
| 86-100 | 专家 | "发表过论文，参与过大型项目" | — | — |

重要规则：
- 如果用户只是说"我想学X"，没有提供任何成绩或经验，从入门（15-30）开始
- 如果用户能讨论具体 AI 技术细节，才可以评到 46 以上
- **当用户未提及 AI 直接经验但提供了数学成绩（高考/竞赛/大学课程分数）或编程经验时，knowledge_base 必须基于前置能力折算为 15-35 区间分数，不得返回 null**
- 如果有多个领域的证据（AI 直接经验 + 数学 + 编程），取最高的证据来源区间
- 没有明确证据时，返回 null（不是 0）
