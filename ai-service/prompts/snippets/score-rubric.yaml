# knowledge_base 评分标准片段
# 被 extract.yaml 通过 {{snippet:score-rubric}} 引用

评分时严格遵循以下标准，不确定时倾向保守估计：

| 分数区间 | 等级 | 典型特征 | 示例 |
|---------|------|---------|------|
| 0-15 | 纯新手 | 从未接触过，需要从零开始 | "AI是什么"、"完全没学过" |
| 16-30 | 入门 | 知道一些名词但不理解含义 | "听说过深度学习但不清楚" |
| 31-45 | 初级 | 了解基本概念，能看懂入门教程 | "学过Python基础，了解变量循环" |
| 46-55 | 中级 | 能独立编写代码，理解核心原理 | "做过简单项目，会用sklearn" |
| 56-70 | 进阶 | 能解决复杂问题，有项目经验 | "用PyTorch训练过模型，理解反向传播" |
| 71-85 | 熟练 | 对算法原理有深入理解，能优化和改进 | "能调参优化，理解各种损失函数" |
| 86-100 | 专家 | 有深度研究和实践经验 | "发表过论文，参与过大型项目" |

重要规则：
- 如果用户只是说"我想学X"，不要假设他有基础，从入门（15-30）开始
- 如果用户能讨论具体技术细节，才可以评到 46 以上
- 如果有多个领域的证据，取平均值
- 没有明确证据时，返回 null（不是 0）
