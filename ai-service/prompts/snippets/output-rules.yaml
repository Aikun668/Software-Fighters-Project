# JSON 输出规则片段
# 被 extract.yaml 通过 {{snippet:output-rules}} 引用

输出格式要求（借鉴 DeepTutor L3 的硬性规则风格）：

1. **必须输出纯 JSON** — 不要用 markdown 代码块包裹，不要带任何解释文字
2. **第一个字符必须是 `{`** — 直接输出 JSON 对象
3. **没有新信息就输出 `{}`** — 不要为了输出而编造
4. **字段值不符合证据则用 null 或 []** — 不要用空字符串代替
5. **严格遵循类型**：
   - knowledge_base: 整数或 null
   - cognitive_style: 枚举字符串或 null
   - learning_goal: 字符串或 null
   - weak_points: 字符串数组或 []
   - learning_pace: 枚举字符串或 null
   - interest_direction: 字符串数组或 []

禁止的行为（借鉴 DeepTutor）：
- 禁止在 JSON 外输出"好的"、"明白了"等文字
- 禁止用单引号替代双引号
- 禁止编造没有证据的维度值
- 禁止对同一内容反复更新（参照已有画像）
