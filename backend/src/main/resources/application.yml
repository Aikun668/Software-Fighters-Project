server:
  port: 8080
  tomcat:
    # 超过 multipart 上限时仍要把可读的错误响应写回客户端。
    # 默认 2MB 会让 Tomcat 在吞掉请求体前直接重置连接，
    # 前端只能看到网络错误而非下方 MaxUploadSizeExceededException 的提示。
    max-swallow-size: 30MB

spring:
  application:
    name: learning-platform

  servlet:
    multipart:
      # 默认上限为 1MB，手机截图/相机照片普遍超过该值，
      # 导致 /api/file/upload 在进入 Controller 之前就抛
      # MaxUploadSizeExceededException，前端只能看到"上传失败"。
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 512KB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/learning_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== Knife4j配置 ====================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-footer: false
    enable-document-manage: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.university


# ==================== MyBatis-Plus配置 ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id  # 雪花算法
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: learning-resources

logging:
  level:
    com.university: debug

learning:
  auth:
    # 默认强制登录：免登录模式下任何人都被当成 user 1，计划/目标/断点/提案会跨会话共享。
    # 本地联调如确需免登录，显式设置环境变量 LEARNING_AUTH_REQUIRED=false。
    required: ${LEARNING_AUTH_REQUIRED:true}

python:
  base-url: http://127.0.0.1:8001/internal